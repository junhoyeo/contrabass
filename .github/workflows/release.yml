name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JS dependencies
        run: bun install

      - name: Build embedded dashboard
        run: make build-dashboard

      - name: Patch flake.nix version
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/version = \".*\";/version = \"${version}\";/" flake.nix
          sed -i "s/-X main.version=.*\"/-X main.version=${version}\"/" flake.nix
          git add flake.nix
          git commit -m "chore(release): bump flake.nix to ${GITHUB_REF_NAME}" || true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Append contributor attribution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun scripts/generate-release-notes.ts "$GITHUB_REF_NAME"
